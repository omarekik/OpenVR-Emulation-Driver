; OpenVR Emulation Driver - Input Mapping Configuration
; Edit this file to remap inputs. Restart SteamVR to apply changes.
;
; XInput button names (for btn_* fields):
;   A  B  X  Y  START  BACK
;   LEFT_SHOULDER  RIGHT_SHOULDER
;   LEFT_THUMB     RIGHT_THUMB
;   DPAD_UP  DPAD_DOWN  DPAD_LEFT  DPAD_RIGHT
;
; Keyboard key values (for key_* fields):
;   Named:   VK_SPACE  VK_LEFT  VK_RIGHT  VK_UP  VK_DOWN
;            VK_RETURN  VK_SHIFT  VK_CONTROL  VK_MENU  VK_TAB  VK_ESCAPE
;   Hex:     0x45  (= E key)    Decimal: 69

; ============================================================
; HMD (head-mounted display)
; ============================================================
[hmd]

; Mouse look (Space toggles on/off)
mouse_sensitivity = 0.003    ; radians per pixel
key_mouse_toggle  = VK_SPACE

; Left stick look
look_speed        = 1.5      ; radians per second

; Left trigger = forward, Left trigger + LB = backward
move_speed        = 1.0      ; metres per second

; ============================================================
; Left controller
; Note: LT, LB, left stick, and gamepad X/Y are all consumed
;       by HMD movement and right-controller pose. They are
;       NOT forwarded as left VR controller inputs.
;
; BACK button: swaps left/right controller input mapping at runtime.
;              Press again to restore. This is hard-coded and cannot
;              be remapped here.
; ============================================================
[left_controller]

; BACK is reserved as the controller-swap toggle (hard-coded, not remappable).
btn_joystick_click  = LEFT_THUMB   ; left-stick click fires joystick click

; ============================================================
; Right controller
; ============================================================
[right_controller]

; Keyboard fallbacks for face buttons
key_a               = 0x45    ; E
key_b               = 0x52    ; R

; XInput bindings
btn_a               = A
btn_b               = B
btn_grip            = RIGHT_SHOULDER
btn_system          = START
btn_joystick_click  = RIGHT_THUMB

; Right stick is always the VR joystick (no toggle needed)

; D-pad: move right-controller pose left/right/forward/back
; Gamepad Y: move pose up   Gamepad X: move pose down
pose_move_speed     = 0.5     ; metres per second

; Trigger
trigger_click_threshold = 0.75
controller_aim_speed    = 1.5   ; radians per second for right-stick aim (when aim mode active)
max_aim_pitch           = 1.047 ; maximum up/down controller aim angle in radians (~pi/3)
